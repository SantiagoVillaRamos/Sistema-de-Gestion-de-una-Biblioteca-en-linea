version: '3.8'

services:
  # -----------------------------------------------------------------
  # 1. Servicio de Base de Datos (PostgreSQL)
  # -----------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: library_db
    restart: always
    env_file:
      - .env.example # Carga las credenciales de la DB
    volumes:
      # Persistencia de datos (opcional, pero recomendado)
      - postgres_data:/var/lib/postgresql/data/
    ports:
      # Exponer el puerto solo para herramientas de gestión externas
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 2. Servicio de Aplicación Python (FastAPI)
  # -----------------------------------------------------------------
  app:
    build: ./backend  # Usa el Dockerfile en el directorio actual
    container_name: library_app
    # Depende de la DB para inicializarse
    depends_on:
      db:
        condition: service_healthy # Espera hasta que la DB esté lista
    restart: always
    env_file:
      - .env.example # Carga la URL de conexión y la clave JWT
    ports:
      # Mapea el puerto 8000 del contenedor al puerto 8000 de tu máquina
      - "8000:8000"
    volumes:
      # Monta el código fuente. Esto permite que los cambios de código se reflejen al instante
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: